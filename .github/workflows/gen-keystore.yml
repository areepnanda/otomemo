name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then echo "KEYSTORE_PASSWORD belum diset"; exit 1; fi
          keytool -genkeypair -v -keystore keystore.jks -alias otomemo \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=OtoMemo, OU=Personal, O=OtoMemo, L=Jakarta, C=ID"
          base64 -w0 keystore.jks > keystore.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
